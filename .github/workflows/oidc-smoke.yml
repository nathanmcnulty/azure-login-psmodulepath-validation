name: OIDC smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in with Azure PowerShell
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      - name: Verify tenant-only context
        shell: pwsh
        run: |
          $context = Get-AzContext
          if ($null -eq $context -or $context.Tenant.Id -ne '${{ vars.AZURE_TENANT_ID }}') {
            throw 'Azure PowerShell context was not established for the expected tenant.'
          }
          [pscustomobject]@{
            Tenant = $context.Tenant.Id
            AccountType = $context.Account.Type
            PSModulePath = $env:PSModulePath
            ImageOS = $env:ImageOS
            ImageVersion = $env:ImageVersion
          } | ConvertTo-Json -Compress
