name: Azure Login OIDC A/B

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  login:
    name: ${{ matrix.arm }}-${{ matrix.repetition }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [base, patched]
        repetition: [1, 2, 3, 4, 5]
    steps:
      - name: Check out validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness

      - name: Check out exact Azure Login base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Azure/login
          ref: 487024fc392f1f60cc70bc8a48233c14bc1de77f
          path: action

      - name: Apply candidate patch
        if: matrix.arm == 'patched'
        working-directory: action
        run: git apply ../harness/patches/psmodulepath.patch

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Build action
        working-directory: action
        run: |
          npm ci
          npm run build

      - name: Log in with Azure PowerShell
        uses: ./action
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      - name: Verify tenant-only context and module source
        shell: pwsh
        env:
          ARM: ${{ matrix.arm }}
          REPETITION: ${{ matrix.repetition }}
        run: |
          $context = Get-AzContext
          $module = Get-Module Az.Accounts
          if ($null -eq $context -or $context.Tenant.Id -ne '${{ vars.AZURE_TENANT_ID }}') {
            throw 'Azure PowerShell context was not established for the expected tenant.'
          }
          if ($null -eq $module) {
            throw 'Az.Accounts was not imported.'
          }
          [pscustomobject]@{
            Arm = $env:ARM
            Repetition = $env:REPETITION
            Tenant = $context.Tenant.Id
            ModuleVersion = $module.Version.ToString()
            ModuleBase = $module.ModuleBase
            PSModulePath = $env:PSModulePath
            ImageOS = $env:ImageOS
            ImageVersion = $env:ImageVersion
          } | ConvertTo-Json -Compress
